<title>Titan Protocol</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">

<style>
* { box-sizing: border-box; }

:root {
  --void:      #0c1014;
  --deck:      #141b21;
  --deck-2:    #1c252d;
  --edge:      #2a3742;
  --edge-hi:   #3d4f5c;
  --ink:       #e6eef4;
  --ink-soft:  #9fb2c0;
  --ink-faint: #6b8090;
  --amber:     #e5a63c;
  --atomic:    #56c8de;
  --good:      #74c98a;
  --ember:     #e07a5f;
  --violet:    #9b8ad4;
  --sil:       #080c10;

  --f-lp: #4f8fd6; --f-lr: #59b0c9; --f-lm: #63c4a5; --f-li: #7cc46e;
  --f-ri: #d9b45c; --f-rm: #dd9a63; --f-rr: #d97f7f; --f-rp: #b98ad0;
  --f-th: #7d8fa0;

  --gap: 1rem;
  --radius: 6px;
  --type-size: 1.9rem;
}
:root[data-contrast="high"] {
  --void: #000; --deck: #0a0a0a; --deck-2: #141414;
  --edge: #666; --edge-hi: #999;
  --ink: #fff; --ink-soft: #ddd; --ink-faint: #bbb;
  --amber: #ffcf5c; --atomic: #7fe3f5; --good: #8ff0a6; --ember: #ff9c7d; --violet: #c4b4ff;
}

html { -webkit-text-size-adjust: 100%; }
body {
  background: var(--void); color: var(--ink);
  font-family: "Atkinson Hyperlegible", system-ui, sans-serif;
  font-size: 16px; line-height: 1.55; margin: 0; min-height: 100vh;
}
:root[data-motion="off"] * { animation: none !important; transition: none !important; }

h1, h2, h3, .stencil { font-family: "Barlow Condensed", "Arial Narrow", sans-serif; letter-spacing: 0.02em; }
.mono, .readout { font-family: "IBM Plex Mono", ui-monospace, monospace; }

button {
  font-family: "Barlow Condensed", sans-serif; font-size: 1rem; letter-spacing: 0.06em;
  text-transform: uppercase; font-weight: 600; color: var(--ink);
  background: var(--deck-2); border: 1px solid var(--edge-hi); border-radius: var(--radius);
  padding: 0.55rem 1.1rem; cursor: pointer; transition: background 120ms ease;
}
button:hover { background: var(--edge); }
button:focus-visible { outline: 2px solid var(--atomic); outline-offset: 2px; }
button.primary { background: var(--amber); color: #17140c; border-color: var(--amber); }
button.primary:hover { background: #f2b556; }
button.ghost { background: transparent; }
button[disabled] { opacity: 0.35; cursor: not-allowed; }

#app { max-width: 62rem; margin: 0 auto; padding: 0 1rem 4rem; }
.topbar { display: flex; align-items: center; gap: 0.85rem; padding: 0.9rem 0; border-bottom: 1px solid var(--edge); flex-wrap: wrap; }
.brand { display: flex; align-items: center; gap: 0.6rem; margin-right: auto; }
.brand .mark { width: 26px; height: 26px; border: 2px solid var(--amber); border-radius: 50%; display: grid; place-items: center; flex: none; }
.brand .mark i { display: block; width: 8px; height: 8px; background: var(--amber); border-radius: 50%; animation: pulse 2.6s ease-in-out infinite; }
.brand b { font-family: "Barlow Condensed", sans-serif; font-size: 1.15rem; letter-spacing: 0.14em; text-transform: uppercase; font-weight: 700; }
.brand small { display: block; font-family: "IBM Plex Mono", monospace; font-size: 0.6rem; letter-spacing: 0.2em; color: var(--ink-faint); text-transform: uppercase; }
.topbar button { padding: 0.35rem 0.7rem; font-size: 0.82rem; }

.screen { padding-top: 1.5rem; display: flex; flex-direction: column; gap: 1.5rem; }
.eyebrow { font-family: "IBM Plex Mono", monospace; font-size: 0.66rem; letter-spacing: 0.22em; text-transform: uppercase; color: var(--ink-faint); }
h2.title { font-size: 2rem; font-weight: 700; margin: 0.25rem 0 0; text-transform: uppercase; letter-spacing: 0.03em; }
h3.sub { font-size: 1.25rem; margin: 0; text-transform: uppercase; letter-spacing: 0.05em; }
p.lede { margin: 0; color: var(--ink-soft); max-width: 44rem; }
.panel { background: var(--deck); border: 1px solid var(--edge); border-radius: var(--radius); padding: 1.1rem 1.2rem; display: flex; flex-direction: column; gap: 0.8rem; }

/* ============ SCENE ART ============ */
.stage-art { position: relative; border: 1px solid var(--edge); border-radius: var(--radius); overflow: hidden; background: #05080b; }
/* Height always follows the viewBox aspect, so nothing is ever cropped.
   Banner shape is set by how wide the viewBox is — see stageArt(). */
.stage-art svg { display: block; width: 100%; height: auto; }
.sil { fill: var(--sil); stroke: currentColor; stroke-width: 1.6; stroke-opacity: 0.6; stroke-linejoin: round; }
.sil.solid { stroke-opacity: 0.28; }
.glowdot { fill: currentColor; filter: drop-shadow(0 0 3px currentColor); }
.bgfar { opacity: 0.5; }
.bgnear { opacity: 0.9; }

@keyframes breathe { 0%,100% { transform: translateY(0) scale(1); } 50% { transform: translateY(-1.6px) scale(1.012); } }
@keyframes sway    { 0%,100% { transform: rotate(-2.4deg); } 50% { transform: rotate(2.4deg); } }
@keyframes flap    { 0%,100% { transform: rotate(-9deg) scaleY(0.94); } 50% { transform: rotate(11deg) scaleY(1.06); } }
@keyframes bob     { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-3px); } }
@keyframes pulse   { 0%,100% { opacity: 0.45; } 50% { opacity: 1; } }
@keyframes drift   { from { transform: translateY(-30px); } to { transform: translateY(210px); } }
@keyframes cloudrun{ from { transform: translateX(-40px); } to { transform: translateX(780px); } }

.g-body { animation: breathe 4.2s ease-in-out infinite; transform-origin: 50% 90%; }
.g-tail { animation: sway 5.4s ease-in-out infinite; transform-origin: 78% 62%; }
.g-wing { animation: flap 2.4s ease-in-out infinite; transform-origin: 62% 55%; }
.g-wing2{ animation: flap 2.4s ease-in-out infinite reverse; transform-origin: 44% 55%; }
.g-head { animation: bob 3.6s ease-in-out infinite; transform-origin: 60% 60%; }
.g-arm  { animation: sway 4.8s ease-in-out infinite; transform-origin: 40% 40%; }
.g-glow { animation: pulse 2.2s ease-in-out infinite; }
.particle { animation: drift linear infinite; }
.cloud { animation: cloudrun linear infinite; opacity: 0.16; }

/* ============ BATTLE FX ============ */
@keyframes lungeR { 0% { transform: translateX(0); } 35% { transform: translateX(26px) scale(1.05); } 100% { transform: translateX(0); } }
@keyframes lungeL { 0% { transform: translateX(0); } 35% { transform: translateX(-26px) scale(1.05); } 100% { transform: translateX(0); } }
@keyframes recoilL{ 0% { transform: translateX(0); } 25% { transform: translateX(-14px) rotate(-3deg); } 100% { transform: translateX(0); } }
@keyframes recoilR{ 0% { transform: translateX(0); } 25% { transform: translateX(14px) rotate(3deg); } 100% { transform: translateX(0); } }
@keyframes beamGo { 0% { transform: scaleX(0); opacity: 0; } 15% { opacity: 1; } 70% { transform: scaleX(1); opacity: 1; } 100% { transform: scaleX(1); opacity: 0; } }
@keyframes shake  { 0%,100% { transform: translate(0,0); } 20% { transform: translate(-5px,3px); } 40% { transform: translate(5px,-3px); } 60% { transform: translate(-4px,-2px); } 80% { transform: translate(4px,2px); } }
@keyframes flashUp{ 0% { opacity: 0; } 25% { opacity: 0.55; } 100% { opacity: 0; } }
@keyframes ringOut{ 0% { r: 4; opacity: 0.9; } 100% { r: 46; opacity: 0; } }

.fx-lunge-r { animation: lungeR 420ms ease-out; }
.fx-lunge-l { animation: lungeL 420ms ease-out; }
.fx-recoil-l { animation: recoilL 380ms ease-out; }
.fx-recoil-r { animation: recoilR 380ms ease-out; }
.beam { transform-origin: left center; opacity: 0; }
.beam.fire { animation: beamGo 520ms ease-out; }
.arena-art.shaking { animation: shake 420ms ease-in-out; }
.flashlayer { position: absolute; inset: 0; background: #fff; opacity: 0; pointer-events: none; }
.flashlayer.go { animation: flashUp 380ms ease-out; }
.impact { opacity: 0; }
.impact.go { animation: ringOut 520ms ease-out; }

/* ============ CAMPAIGN CARDS ============ */
.campaigns { display: grid; grid-template-columns: repeat(auto-fit, minmax(17rem, 1fr)); gap: var(--gap); }
.camp {
  background: var(--deck); border: 1px solid var(--edge); border-radius: var(--radius);
  padding: 0; text-align: left; display: flex; flex-direction: column;
  text-transform: none; letter-spacing: normal; font-family: "Atkinson Hyperlegible", sans-serif;
  font-weight: 400; overflow: hidden;
}
.camp:hover { background: var(--deck-2); border-color: var(--edge-hi); }
.camp .capsule { padding: 1rem 1.1rem; display: flex; flex-direction: column; gap: 0.5rem; }
.camp .cname { font-family: "Barlow Condensed", sans-serif; font-size: 1.35rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.04em; line-height: 1.1; }
.camp .cdesc { color: var(--ink-soft); font-size: 0.9rem; }
.camp .cmeta { font-family: "IBM Plex Mono", monospace; font-size: 0.68rem; letter-spacing: 0.1em; color: var(--ink-faint); text-transform: uppercase; }
.bar { height: 4px; background: var(--edge); border-radius: 2px; overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--amber); border-radius: 2px; transition: width 400ms ease; }

/* ============ STAGE LIST ============ */
.stages { display: flex; flex-direction: column; gap: 0.65rem; }
.stage { background: var(--deck); border: 1px solid var(--edge); border-radius: var(--radius); padding: 0.85rem 1rem; display: grid; gap: 0.6rem; grid-template-columns: 2.4rem 1fr; align-items: start; }
.stage .num { font-family: "IBM Plex Mono", monospace; font-size: 0.8rem; color: var(--ink-faint); border: 1px solid var(--edge); border-radius: 4px; text-align: center; padding: 0.2rem 0; }
.stage.done .num { color: var(--good); border-color: var(--good); }
.stage .sname { font-family: "Barlow Condensed", sans-serif; font-size: 1.12rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em; }
.stage .skeys { font-family: "IBM Plex Mono", monospace; font-size: 0.7rem; color: var(--ink-faint); letter-spacing: 0.06em; }
.nodes { display: flex; gap: 0.4rem; flex-wrap: wrap; margin-top: 0.5rem; }
.node { font-family: "IBM Plex Mono", monospace; font-size: 0.72rem; letter-spacing: 0.05em; text-transform: none; padding: 0.4rem 0.7rem; border-radius: 4px; background: var(--deck-2); border: 1px solid var(--edge); color: var(--ink-soft); display: flex; align-items: center; gap: 0.4rem; }
.node:hover { background: var(--edge); }
.node.boss { border-color: var(--ember); color: var(--ember); font-weight: 600; }
.node.cleared { border-color: var(--good); color: var(--good); }
.node.cleared::before { content: "✓"; }
.node.locked { opacity: 0.3; cursor: not-allowed; }
.node.locked:hover { background: var(--deck-2); }

/* ============ TYPING ============ */
.stagewrap { display: flex; flex-direction: column; gap: 1rem; }
.hud { display: flex; align-items: center; gap: 1rem; flex-wrap: wrap; }
.hud .readout { font-size: 0.72rem; letter-spacing: 0.12em; text-transform: uppercase; color: var(--ink-faint); }
.hud .spacer { margin-left: auto; }
.progdots { display: flex; gap: 4px; flex-wrap: wrap; }
.progdots i { width: 12px; height: 6px; border-radius: 2px; background: var(--edge); display: block; transition: background 200ms ease; }
.progdots i.on { background: var(--good); }
.progdots i.now { background: var(--amber); }

.typebox { background: var(--deck); border: 1px solid var(--edge); border-radius: var(--radius); padding: 1.6rem 1.5rem; min-height: 8rem; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 0.9rem; text-align: center; }
.prompt { font-size: var(--type-size); font-weight: 700; line-height: 1.45; letter-spacing: 0.04em; word-break: break-word; max-width: 46rem; }
.prompt .ch { border-bottom: 2px solid transparent; padding-bottom: 1px; }
.prompt .ch.done { color: var(--good); }
.prompt .ch.now { border-bottom-color: var(--amber); background: rgba(229,166,60,0.16); border-radius: 2px; }
.prompt .ch.now.bad { background: rgba(224,122,95,0.3); border-bottom-color: var(--ember); }
.hint { font-size: 0.85rem; color: var(--ink-faint); margin: 0; }
.hiddeninput { position: absolute; opacity: 0; pointer-events: none; width: 1px; height: 1px; }

#kbdSlot { max-width: 100%; overflow-x: auto; padding-bottom: 4px; }
.kbd { display: flex; flex-direction: column; gap: 5px; align-items: center; width: max-content; margin: 0 auto; min-width: 100%; }
.krow { display: flex; gap: 5px; flex-wrap: nowrap; }
.key { width: clamp(1.5rem, 3.6vw, 2.2rem); height: clamp(1.5rem, 3.6vw, 2.2rem); border-radius: 5px; background: var(--deck-2); border: 1px solid var(--edge); border-bottom-width: 3px; display: grid; place-items: center; font-family: "IBM Plex Mono", monospace; font-size: clamp(0.58rem, 1.5vw, 0.78rem); color: var(--ink-soft); flex: none; transition: background 90ms ease; }
.key.wide { width: clamp(3rem, 7vw, 4.2rem); }
.key.space { width: clamp(6rem, 16vw, 11rem); }
.key.target { background: var(--amber); color: #17140c; border-color: var(--amber); font-weight: 600; }
.key.target.bad { background: var(--ember); border-color: var(--ember); }
.key[data-f="lp"] { border-bottom-color: var(--f-lp); } .key[data-f="lr"] { border-bottom-color: var(--f-lr); }
.key[data-f="lm"] { border-bottom-color: var(--f-lm); } .key[data-f="li"] { border-bottom-color: var(--f-li); }
.key[data-f="ri"] { border-bottom-color: var(--f-ri); } .key[data-f="rm"] { border-bottom-color: var(--f-rm); }
.key[data-f="rr"] { border-bottom-color: var(--f-rr); } .key[data-f="rp"] { border-bottom-color: var(--f-rp); }
.key[data-f="th"] { border-bottom-color: var(--f-th); }
.fingerhint { font-family: "IBM Plex Mono", monospace; font-size: 0.7rem; letter-spacing: 0.1em; text-transform: uppercase; color: var(--ink-faint); }

/* ============ BATTLE ============ */
.arena-art { position: relative; border: 1px solid var(--edge); border-radius: var(--radius); overflow: hidden; background: #05080b; }
.arena-art svg { display: block; width: 100%; height: auto; }
.combat { display: grid; grid-template-columns: 1fr; gap: 0.6rem; }
@media (min-width: 44rem) { .combat { grid-template-columns: 1fr 1fr; } }
.gauge { background: var(--deck); border: 1px solid var(--edge); border-radius: var(--radius); padding: 0.7rem 0.9rem; display: flex; flex-direction: column; gap: 0.4rem; }
.gauge .gname { font-family: "Barlow Condensed", sans-serif; font-size: 1.05rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em; line-height: 1; }
.gauge .gsub { font-family: "IBM Plex Mono", monospace; font-size: 0.62rem; letter-spacing: 0.13em; color: var(--ink-faint); text-transform: uppercase; }
.hpbar { height: 10px; background: var(--edge); border-radius: 5px; overflow: hidden; }
.hpbar i { display: block; height: 100%; width: 100%; background: var(--ember); transition: width 300ms ease; }
.charge { height: 5px; background: var(--edge); border-radius: 3px; overflow: hidden; }
.charge i { display: block; height: 100%; width: 0; background: var(--amber); transition: width 160ms ease; }
.shields { display: flex; gap: 5px; }
.shields i { width: 16px; height: 16px; border: 2px solid var(--atomic); border-radius: 3px; display: block; transition: opacity 200ms ease; }
.shields i.gone { border-color: var(--edge); opacity: 0.35; }

/* ============ STORY ============ */
.storywrap { display: flex; flex-direction: column; gap: 1.1rem; }
.chapline { display: flex; align-items: baseline; gap: 0.7rem; flex-wrap: wrap; }
.chapno { font-family: "IBM Plex Mono", monospace; font-size: 0.68rem; letter-spacing: 0.2em; color: var(--amber); text-transform: uppercase; }
.storytext { font-size: 1.14rem; line-height: 1.75; max-width: 40rem; margin: 0; }
.storytext + .storytext { margin-top: 0.9rem; }
.dropcap::first-letter { font-family: "Barlow Condensed", sans-serif; font-size: 3.1rem; line-height: 0.82; float: left; padding: 0.1rem 0.5rem 0 0; color: var(--amber); font-weight: 700; }
.callout { border-left: 3px solid var(--amber); background: var(--deck); border-radius: 0 var(--radius) var(--radius) 0; padding: 0.8rem 1rem; color: var(--ink-soft); font-size: 0.95rem; }
.callout.ember { border-left-color: var(--ember); }
.callout.atomic { border-left-color: var(--atomic); }
.speaker { font-family: "IBM Plex Mono", monospace; font-size: 0.65rem; letter-spacing: 0.16em; text-transform: uppercase; color: var(--ink-faint); display: block; margin-bottom: 0.25rem; }

/* ============ DOSSIERS ============ */
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(15rem, 1fr)); gap: var(--gap); }
.dossier { background: var(--deck); border: 1px solid var(--edge); border-radius: var(--radius); overflow: hidden; display: flex; flex-direction: column; }
.dossier .dbody { padding: 0.9rem 1rem; display: flex; flex-direction: column; gap: 0.35rem; }
.dossier.sealed { opacity: 0.45; }
.dossier .dname { font-family: "Barlow Condensed", sans-serif; font-size: 1.15rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; line-height: 1.05; }
.dossier .drow { font-family: "IBM Plex Mono", monospace; font-size: 0.63rem; letter-spacing: 0.09em; color: var(--ink-faint); text-transform: uppercase; }
.dossier .dnote { font-size: 0.86rem; color: var(--ink-soft); }

/* ============ SETTINGS ============ */
.setgrid { display: grid; grid-template-columns: repeat(auto-fit, minmax(15rem, 1fr)); gap: 0.4rem 1.5rem; }
.setrow { display: flex; align-items: center; justify-content: space-between; gap: 0.75rem; padding: 0.45rem 0; border-bottom: 1px solid var(--edge); }
.toggle { border-radius: 20px; padding: 0.25rem 0.85rem; font-size: 0.72rem; min-width: 4.5rem; }
.toggle[aria-pressed="true"] { background: rgba(86,200,222,0.16); border-color: var(--atomic); color: var(--atomic); }
table.stats { width: 100%; border-collapse: collapse; font-family: "IBM Plex Mono", monospace; font-size: 0.8rem; }
table.stats th, table.stats td { text-align: left; padding: 0.45rem 0.6rem; border-bottom: 1px solid var(--edge); }
table.stats th { font-size: 0.63rem; letter-spacing: 0.12em; text-transform: uppercase; color: var(--ink-faint); font-weight: 500; }
table.stats td { font-variant-numeric: tabular-nums; }
.scroller { overflow-x: auto; }
.row { display: flex; gap: 0.6rem; flex-wrap: wrap; align-items: center; }
.bigstat { display: flex; flex-direction: column; gap: 0.1rem; }
.bigstat b { font-family: "Barlow Condensed", sans-serif; font-size: 2.3rem; line-height: 1; color: var(--amber); font-variant-numeric: tabular-nums; }
.bigstat span { font-family: "IBM Plex Mono", monospace; font-size: 0.65rem; letter-spacing: 0.12em; text-transform: uppercase; color: var(--ink-faint); }

/* ============ MOVES + FINISHER ============ */
.movebanner { position: absolute; left: 0; right: 0; top: 6%; text-align: center; pointer-events: none; }
.movebanner b {
  display: inline-block; font-family: "Barlow Condensed", sans-serif; font-size: clamp(1.1rem, 3.4vw, 1.7rem);
  letter-spacing: 0.16em; text-transform: uppercase; color: var(--amber);
  text-shadow: 0 2px 12px #000, 0 0 4px #000; opacity: 0;
}
.movebanner b.go { animation: moveIn 950ms ease-out; }
.movebanner b.fin { color: #fff; font-size: clamp(1.5rem, 5vw, 2.6rem); text-shadow: 0 0 18px var(--atomic), 0 2px 12px #000; }
@keyframes moveIn { 0% { opacity: 0; transform: translateY(12px) scale(0.9); } 18% { opacity: 1; transform: translateY(0) scale(1); } 72% { opacity: 1; } 100% { opacity: 0; } }
@keyframes bigbeam { 0% { transform: scaleX(0) scaleY(0.3); opacity: 0; } 10% { opacity: 1; } 55% { transform: scaleX(1) scaleY(1.7); opacity: 1; } 100% { transform: scaleX(1) scaleY(2.3); opacity: 0; } }
.bigbeam { transform-origin: left center; opacity: 0; }
.bigbeam.fire { animation: bigbeam 1150ms ease-out; }
.chargebar { height: 7px; background: var(--edge); border-radius: 4px; overflow: hidden; }
.chargebar i { display: block; height: 100%; width: 0; background: linear-gradient(90deg, var(--atomic), #ffffff); transition: width 260ms ease; }
.chargebar.full { box-shadow: 0 0 10px var(--atomic); }
.chargebar.full i { animation: pulse 800ms ease-in-out infinite; }
.readybadge { color: var(--atomic); font-weight: 700; letter-spacing: 0.14em; }

/* ============ TUTORIAL ============ */
.tut-veil { position: fixed; inset: 0; background: rgba(4,7,10,0.82); z-index: 60; }
.tut-hole { position: fixed; border: 2px solid var(--amber); border-radius: 8px; box-shadow: 0 0 0 9999px rgba(4,7,10,0.82), 0 0 22px rgba(229,166,60,0.7); z-index: 61; pointer-events: none; transition: all 260ms ease; }
.tut-box { position: fixed; z-index: 62; max-width: 22rem; background: var(--deck); border: 1px solid var(--edge-hi); border-radius: var(--radius); padding: 1rem 1.1rem; display: flex; flex-direction: column; gap: 0.7rem; box-shadow: 0 14px 40px rgba(0,0,0,0.6); }
.tut-box h4 { font-family: "Barlow Condensed", sans-serif; font-size: 1.2rem; margin: 0; text-transform: uppercase; letter-spacing: 0.06em; }
.tut-box p { margin: 0; font-size: 0.94rem; color: var(--ink-soft); }
.tut-box .tut-nav { display: flex; gap: 0.5rem; align-items: center; }
.tut-step { font-family: "IBM Plex Mono", monospace; font-size: 0.66rem; letter-spacing: 0.14em; color: var(--ink-faint); margin-right: auto; }
.tut-cta { border: 1px dashed var(--amber); border-radius: var(--radius); padding: 0.9rem 1rem; display: flex; gap: 0.9rem; align-items: center; flex-wrap: wrap; }
.tut-cta p { margin: 0; color: var(--ink-soft); font-size: 0.94rem; flex: 1; min-width: 12rem; }

/* ============ PLAYERS ============ */
.players { display: grid; grid-template-columns: repeat(auto-fill, minmax(12rem, 1fr)); gap: var(--gap); }
.player { background: var(--deck); border: 1px solid var(--edge); border-radius: var(--radius); overflow: hidden; display: flex; flex-direction: column; }
.player:hover { border-color: var(--amber); }

/* Scenes are authored 240 wide. For wide banners the landscape layers are
   tiled side by side — the far and near polygons start and end at matching
   heights, so the joins do not show. */
function sceneSVG(key, id, tiles){
  const s = SCENES[key] || SCENES.ocean;
  tiles = tiles || 1;
  const W = 240 * tiles;
  const band = (inner, cls, fill) => {
    let g = "";
    for (let t = 0; t < tiles; t++) g += '<g transform="translate(' + (240 * t) + ',0)">' + inner + "</g>";
    return '<g class="' + cls + '"' + (fill ? ' fill="' + fill + '"' : "") + ">" + g + "</g>";
  };
  let out = '<defs><linearGradient id="sky'+id+'" x1="0" y1="0" x2="0" y2="1">' +
    '<stop offset="0%" stop-color="'+s.sky[0]+'"/><stop offset="100%" stop-color="'+s.sky[1]+'"/></linearGradient></defs>' +
    '<rect x="0" y="0" width="'+W+'" height="180" fill="url(#sky'+id+')"/>';
  if (s.orb) {
    const ox = s.orb[0] + 240 * Math.floor(tiles / 2);
    out += '<circle cx="'+ox+'" cy="'+s.orb[1]+'" r="'+s.orb[2]+'" fill="'+s.orb[3]+'" opacity="0.5"/>';
  }
  for (let i = 0; i < (s.cloud || 0); i++) {
    const y = 26 + i * 22, d = 26 + i * 9;
    out += '<ellipse class="cloud" cx="0" cy="'+y+'" rx="34" ry="7" fill="#ffffff" style="animation-duration:'+d+'s;animation-delay:-'+(i*7)+'s"/>';
  }
  out += band(s.far === "city" ? CITY : '<polygon points="'+s.far+'"/>', "bgfar", "#0e1a24");
  const pc = (s.pcount || 0) * tiles;
  for (let i = 0; i < pc; i++) {
    const x = (i * 37 + 11) % (W - 4), r = 0.8 + (i % 3) * 0.5, d = 5 + (i % 5) * 2.4;
    out += '<circle class="particle" cx="'+x+'" cy="0" r="'+r+'" fill="'+(s.pcolor||"#fff")+'" opacity="0.5" ' +
           'style="animation-duration:'+d+'s;animation-delay:-'+((i*0.7)%d).toFixed(1)+'s"/>';
  }
  out += band('<polygon points="'+s.near+'"/>', "bgnear", s.nearFill);
  return out;
}

function titanSVG(id, color, opts){
  const r = RIG[id]; if (!r) return "";
  opts = opts || {};
  const parts = r.parts.map(p =>
    '<polygon class="sil g-' + p[0] + '" points="' + p[1] + '"/>').join("");
  const dots = (r.dots || []).map(d =>
    '<circle class="glowdot g-glow" cx="'+d[0]+'" cy="'+d[1]+'" r="'+d[2]+'"/>').join("");
  const tf = [];
  if (opts.flip) tf.push("translate(" + (opts.flipW || 240) + ",0) scale(-1,1)");
  if (opts.scale && opts.scale !== 1) tf.push("translate(" + (opts.dx||0) + "," + (opts.dy||0) + ") scale(" + opts.scale + ")");
  else if (opts.dx || opts.dy) tf.push("translate(" + (opts.dx||0) + "," + (opts.dy||0) + ")");
  return '<g style="color:' + color + '"' + (tf.length ? ' transform="' + tf.join(" ") + '"' : "") +
         (opts.id ? ' id="' + opts.id + '"' : "") + '>' + parts + dots + '</g>';
}

let artSeq = 0;
/* mode: "strip" = wide 4:1 banner above a typing exercise
         "hero"  = 8:3 banner for story chapters and storyline pages
         "card"  = 4:3 for the narrow campaign cards                     */
const ART_TILES = { strip: 3, hero: 2, card: 1 };
function stageArt(sceneKey, titanId, color, mode){
  if (!S.settings.art) return "";
  const id = "a" + (++artSeq);
  const tiles = ART_TILES[mode] || ART_TILES.hero;
  const W = 240 * tiles, sc = 0.85;
  return '<div class="stage-art ' + (mode || "hero") + '">' +
    '<svg viewBox="0 0 ' + W + ' 180" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Scene illustration">' +
    sceneSVG(sceneKey, id, tiles) +
    (titanId ? titanSVG(titanId, color, { scale: sc, dx: (W - 240 * sc) / 2, dy: 22 }) : "") +
    '</svg></div>';
}

const LEGACY_KEY  = "titan-protocol-v2";        // single-player save, pre-profiles
const PROFILE_KEY = "titan-protocol-players";
const SAVE_PREFIX = "titan-protocol-save-";
const DEFAULTS = {
  cleared: {}, cards: {}, keyStats: {}, read: {},
  tutorialDone: false,
  settings: { sound:true, speech:true, motion:true, art:true, keyboard:true, music:true, musicVol:0.5, contrast:"normal", typeSize:1.9 }
};
/* Avatars are just Titans the player picks to represent them. */
const AVATARS = ["godzilla","kong","mothra","rodan","ghidorah","behemoth","tiamat","skarking"];

let PLAYERS = { list: [], activeId: null };
let S = null;   // the active player's save

function seedDefaults(){
  const d = JSON.parse(JSON.stringify(DEFAULTS));
  try { if (window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches) d.settings.motion = false; } catch(e) {}
  return d;
}
function normalise(raw){
  if (!raw) return seedDefaults();
  return Object.assign(seedDefaults(), raw, { settings: Object.assign({}, DEFAULTS.settings, raw.settings || {}) });
}
function readSave(id){
  try { return normalise(JSON.parse(localStorage.getItem(SAVE_PREFIX + id))); }
  catch(e) { return seedDefaults(); }
}
function writeSave(id, data){ try { localStorage.setItem(SAVE_PREFIX + id, JSON.stringify(data)); } catch(e) {} }
function savePlayers(){ try { localStorage.setItem(PROFILE_KEY, JSON.stringify(PLAYERS)); } catch(e) {} }
function save(){ if (PLAYERS.activeId) writeSave(PLAYERS.activeId, S); }

function newPlayerId(){ return "p" + Date.now().toString(36) + Math.floor(Math.random() * 1296).toString(36); }
function createPlayer(name, avatar, initial){
  const p = { id: newPlayerId(), name: name, avatar: avatar || AVATARS[PLAYERS.list.length % AVATARS.length] };
  PLAYERS.list.push(p);
  writeSave(p.id, initial || seedDefaults());
  savePlayers();
  return p;
}
function selectPlayer(id){
  PLAYERS.activeId = id;
  savePlayers();
  S = readSave(id);
  applySettings();
  paintPlayerButton();
}
function activePlayer(){
  for (let i = 0; i < PLAYERS.list.length; i++) if (PLAYERS.list[i].id === PLAYERS.activeId) return PLAYERS.list[i];
  return PLAYERS.list[0] || null;
}
function deletePlayer(id){
  PLAYERS.list = PLAYERS.list.filter(p => p.id !== id);
  try { localStorage.removeItem(SAVE_PREFIX + id); } catch(e) {}
  if (PLAYERS.activeId === id) PLAYERS.activeId = PLAYERS.list.length ? PLAYERS.list[0].id : null;
  savePlayers();
}
function playerStats(id){
  const d = readSave(id);
  let h = 0, m = 0;
  for (const k in d.keyStats) { h += d.keyStats[k][0]; m += d.keyStats[k][1]; }
  return { chapters: Object.keys(d.read || {}).length,
           cleared: Object.keys(d.cleared || {}).length,
           acc: (h + m) ? Math.round(h / (h + m) * 100) : 100 };
}
function paintPlayerButton(){
  const b = el("btnPlayer"); if (!b) return;
  const p = activePlayer();
  b.textContent = p ? "◆ " + p.name : "◆ Players";
}
function applySettings(){
  const r = document.documentElement;
  r.setAttribute("data-motion", S.settings.motion ? "on" : "off");
  r.setAttribute("data-contrast", S.settings.contrast);
  r.style.setProperty("--type-size", S.settings.typeSize + "rem");
}

/* ---------------- audio ---------------- */
let AC = null;
function tone(freq, ms, vol, type){
  if (!S.settings.sound) return;
  try {
    AC = AC || new (window.AudioContext || window.webkitAudioContext)();
    if (AC.state === "suspended") AC.resume();
    const o = AC.createOscillator(), g = AC.createGain();
    o.type = type || "sine"; o.frequency.value = freq;
    g.gain.setValueAtTime(vol || 0.05, AC.currentTime);
    g.gain.exponentialRampToValueAtTime(0.0001, AC.currentTime + ms / 1000);
    o.connect(g); g.connect(AC.destination);
    o.start(); o.stop(AC.currentTime + ms / 1000);
  } catch(e) {}
}
const SFX = {
  ok:   () => tone(660, 55, 0.03),
  word: () => { tone(760, 80, 0.05); setTimeout(() => tone(990, 110, 0.05), 70); },
  miss: () => tone(210, 90, 0.028),
  hit:  () => { tone(140, 150, 0.06, "sawtooth"); setTimeout(() => tone(100, 200, 0.05, "sawtooth"), 90); },
  hurt: () => { tone(80, 300, 0.055, "square"); },
  win:  () => { [523, 659, 784, 1047].forEach((f, i) => setTimeout(() => tone(f, 240, 0.05), i * 115)); }
};
function speak(text){
  if (!S.settings.speech || !window.speechSynthesis) return;
  try {
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.rate = 0.86;
    speechSynthesis.speak(u);
  } catch(e) {}
}

/* =========================================================================
   MUSIC
   Two sources, in order of preference:
     1. Real tracks, if they are sitting next to this file in ./music/
        (explore.mp3, battle.mp3, story.mp3, victory.mp3). Scott Buckley's
        library at scottbuckley.com.au is CC BY 4.0 — free even commercially,
        credit required. Drop his MP3s in with those names and they play.
        Note: the hosted version blocks outside audio, so this path only
        works when the file is run locally.
     2. Otherwise an original score generated live in the browser — no files,
        no licence, works anywhere. Slow minor pads, low drone, and for the
        boss fights a timpani pulse underneath.
   ========================================================================= */
const MUSIC = (function(){
  const THEMES = {
    explore: { root:45, bpm:50, prog:[[0,3,7],[-4,0,3],[-2,3,7],[-5,0,4]], gain:0.12, drums:false, mel:true,  wave:"triangle" },
    story:   { root:48, bpm:44, prog:[[0,4,7],[-3,0,5],[-5,0,4],[-7,0,3]], gain:0.10, drums:false, mel:false, wave:"sine" },
    battle:  { root:33, bpm:92, prog:[[0,3,7],[0,3,10],[-2,3,6],[-3,0,4]], gain:0.14, drums:true,  mel:true,  wave:"triangle" },
    victory: { root:50, bpm:66, prog:[[0,4,7],[5,9,12],[-3,4,9],[0,4,7]], gain:0.14, drums:false, mel:true,  wave:"triangle" }
  };
  let ctx = null, master = null, verbIn = null, timer = null, beat = 0, cur = null, audioEl = null, useFiles = null;
  // Every play() takes a ticket. A track load that finishes after a newer
  // play() has started is stale and throws itself away, so two tracks can
  // never end up running on top of each other.
  let ticket = 0, pending = null;

  function mtof(m){ return 440 * Math.pow(2, (m - 69) / 12); }
  function impulse(){
    const len = Math.floor(ctx.sampleRate * 2.4), buf = ctx.createBuffer(2, len, ctx.sampleRate);
    for (let c = 0; c < 2; c++){
      const d = buf.getChannelData(c);
      for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 2.8);
    }
    return buf;
  }
  function init(){
    if (ctx) return true;
    try { ctx = new (window.AudioContext || window.webkitAudioContext)(); } catch(e){ return false; }
    master = ctx.createGain();
    master.gain.value = S.settings.musicVol;
    master.connect(ctx.destination);
    try {
      const cv = ctx.createConvolver(); cv.buffer = impulse();
      const w = ctx.createGain(); w.gain.value = 0.45;
      cv.connect(w); w.connect(master); verbIn = cv;
    } catch(e) { verbIn = null; }
    return true;
  }
  function voice(midi, dur, type, gain, detune){
    const o = ctx.createOscillator(), g = ctx.createGain(), f = ctx.createBiquadFilter(), t = ctx.currentTime;
    o.type = type; o.frequency.value = mtof(midi); if (detune) o.detune.value = detune;
    f.type = "lowpass"; f.frequency.value = 1200 + Math.random() * 600;
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(Math.max(0.0002, gain), t + Math.min(1.2, dur * 0.35));
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(f); f.connect(g); g.connect(master);
    if (verbIn) g.connect(verbIn);
    o.start(t); o.stop(t + dur + 0.15);
  }
  function thump(){
    const o = ctx.createOscillator(), g = ctx.createGain(), t = ctx.currentTime;
    o.type = "sine";
    o.frequency.setValueAtTime(120, t);
    o.frequency.exponentialRampToValueAtTime(32, t + 0.32);
    g.gain.setValueAtTime(0.34, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 0.5);
    o.connect(g); g.connect(master);
    o.start(t); o.stop(t + 0.55);
  }
  function tick(){
    if (!cur || !ctx) return;
    const th = THEMES[cur], spb = 60 / th.bpm, bar = beat % 4, chord = th.prog[Math.floor(beat / 4) % th.prog.length];
    if (bar === 0) {
      chord.forEach((iv, i) => voice(th.root + iv, spb * 4.4, th.wave, th.gain * (i ? 0.6 : 1), i * 4 - 4));
      voice(th.root - 12, spb * 4.6, "sine", th.gain * 1.1, 0);
    }
    if (th.drums && (bar === 0 || bar === 2)) thump();
    // One slow melody note, halfway through the bar, and always a note from
    // the chord that is currently sounding — so it can never clash with it.
    if (th.mel && bar === 2) {
      const iv = chord[Math.floor(Math.random() * chord.length)];
      voice(th.root + 24 + iv, spb * 2.2, "triangle", th.gain * 0.38, 0);
    }
    beat++;
    timer = setTimeout(tick, spb * 1000);
  }
  function stopGenerated(){ if (timer) { clearTimeout(timer); timer = null; } }
  function stopFile(){ if (audioEl) { try { audioEl.pause(); } catch(e){} audioEl = null; } }

  function tryFile(name){
    return new Promise(res => {
      let a;
      try { a = new Audio("music/" + name + ".mp3"); } catch(e) { return res(null); }
      a.loop = true;
      a.preload = "auto";
      a.volume = S.settings.musicVol;
      let done = false;
      // loadedmetadata fires as soon as the file is found and decodable, which
      // for a 9MB track is far sooner than canplaythrough would be.
      const ok = () => { if (!done) { done = true; res(a); } };
      const no = () => { if (!done) { done = true; res(null); } };
      a.addEventListener("loadedmetadata", ok, { once: true });
      a.addEventListener("canplay", ok, { once: true });
      a.addEventListener("error", no, { once: true });
      setTimeout(no, 4000);
      try { a.load(); } catch(e) { no(); }
    });
  }

  return {
    play: function(name){
      if (!S.settings.music) return;
      // Already playing this, or already loading it — leave it alone.
      if (cur === name && (timer || audioEl || pending === name)) return;
      const mine = ++ticket;
      cur = name; pending = name; beat = 0;
      stopGenerated(); stopFile();
      if (!init()) { pending = null; return; }
      if (ctx.state === "suspended") { try { ctx.resume(); } catch(e){} }
      if (useFiles === false) { pending = null; tick(); return; }
      tryFile(name).then(a => {
        if (mine !== ticket) {           // superseded while loading
          if (a) { try { a.pause(); } catch(e) {} }
          return;
        }
        pending = null;
        if (a) { useFiles = true; audioEl = a; a.play().catch(() => { audioEl = null; tick(); }); }
        else { if (useFiles === null) useFiles = false; tick(); }
      });
    },
    stop: function(){ ++ticket; cur = null; pending = null; stopGenerated(); stopFile(); },
    source: function(){
      if (!cur) return "not playing";
      if (audioEl) return "your MP3s";
      if (useFiles === false) return "generated score (no MP3s found)";
      return "starting…";
    },
    vol: function(v){
      if (master) master.gain.value = v;
      if (audioEl) audioEl.volume = v;
    },
    sting: function(){
      if (!S.settings.music || !init()) return;
      [0, 4, 7, 12].forEach((iv, i) => setTimeout(() => voice(57 + iv, 1.4, "triangle", 0.13, 0), i * 120));
    }
  };
})();

/* ---------------- addressing ---------------- */
function nodeId(ci, si, li){ return CONTENT[ci].id + "." + si + "." + li; }
function bossIndex(ci, si){ return CONTENT[ci].stages[si].levels.length; }
function allNodes(ci, si){ const n = []; for (let i = 0; i <= bossIndex(ci, si); i++) n.push(i); return n; }
function isCleared(ci, si, li){ return !!S.cleared[nodeId(ci, si, li)]; }
function stageComplete(ci, si){ return allNodes(ci, si).every(li => isCleared(ci, si, li)); }
function nodeUnlocked(ci, si, li){
  if (si === 0 && li === 0) return true;
  if (li > 0) return isCleared(ci, si, li - 1);
  return stageComplete(ci, si - 1);
}
function campaignProgress(ci){
  let done = 0, total = 0;
  CONTENT[ci].stages.forEach((_, si) => allNodes(ci, si).forEach(li => { total++; if (isCleared(ci, si, li)) done++; }));
  return { done: done, total: total, pct: total ? Math.round(done / total * 100) : 0 };
}
function chapterNumber(ci, si, li){
  let n = 0;
  for (let c = 0; c <= ci; c++) {
    for (let s = 0; s < CONTENT[c].stages.length; s++) {
      const max = bossIndex(c, s);
      for (let l = 0; l <= max; l++) {
        n++;
        if (c === ci && s === si && l === li) return n;
      }
    }
  }
  return n;
}

/* ---------------- adaptive ordering ---------------- */
function weakKeys(n){
  const scored = [];
  for (const k in S.keyStats) {
    const s = S.keyStats[k];
    if (s[0] + s[1] >= 8) scored.push([k, s[1] / (s[0] + s[1])]);
  }
  scored.sort((a, b) => b[1] - a[1]);
  return scored.filter(x => x[1] > 0.06).slice(0, n).map(x => x[0]);
}
function adaptOrder(words){
  const weak = weakKeys(3);
  if (!weak.length) return words.slice();
  const score = w => weak.reduce((n, k) => n + (w.toLowerCase().split(k).length - 1), 0);
  return words.slice().sort((a, b) => score(b) - score(a));
}
function recordKey(ch, hit){
  const k = baseKey(ch); if (!k) return;
  if (!S.keyStats[k]) S.keyStats[k] = [0, 0];
  S.keyStats[k][hit ? 0 : 1]++;
}
function overallAccuracy(){
  let h = 0, m = 0;
  for (const k in S.keyStats) { h += S.keyStats[k][0]; m += S.keyStats[k][1]; }
  return h + m ? Math.round(h / (h + m) * 100) : 100;
}

    '<rect width="240" height="180" fill="#0d141a"/>' +
    titanSVG(rig, color, { scale: 0.8, dx: 24, dy: 26 }) + "</svg></div>";
}
function avatarColor(rig){
  for (const k in TITANS) if (TITANS[k].rig === rig) return TITANS[k].color;
  return "var(--amber)";
}

  const cards = PLAYERS.list.map(p => {

    return '<div class="player' + (p.id === PLAYERS.activeId ? " current" : "") + '">' +

  show('<div class="screen">' +

    '<p class="lede">Everyone gets their own story, their own dossiers and their own settings. Nothing you do affects anybody else\'s game.</p>' +

    screenMap();
  }));
  root.querySelectorAll("[data-ren]").forEach(b => b.addEventListener("click", e => {
    e.stopPropagation();
    const p = PLAYERS.list.filter(x => x.id === b.dataset.ren)[0];
    screenEditPlayer(p);
  }));
  root.querySelectorAll("[data-del]").forEach(b => b.addEventListener("click", e => {
    e.stopPropagation();
    const p = PLAYERS.list.filter(x => x.id === b.dataset.del)[0];
    const st = playerStats(p.id);
    if (!confirm("Delete " + p.name + "?\n\nThis erases " + st.chapters + " chapters, " + st.cleared +

    deletePlayer(p.id);
    if (!PLAYERS.list.length) { createPlayer("Nolan", "godzilla"); PLAYERS.activeId = PLAYERS.list[0].id; savePlayers(); }
    selectPlayer(PLAYERS.activeId);
    screenPlayers();
  }));
  on("addplayer", () => screenEditPlayer(null));

function screenEditPlayer(existing){
  T = null;
  let chosen = existing ? existing.avatar : AVATARS[PLAYERS.list.length % AVATARS.length];
  const picks = AVATARS.map(a =>
    '<button data-av="' + a + '" aria-pressed="' + (a === chosen) + '">' + avatarArt(a, avatarColor(a)) + "</button>").join("");

  show('<div class="screen">' +
    '<div><span class="eyebrow">' + (existing ? "Edit player" : "New player") + '</span>' +
    '<h2 class="title">' + (existing ? "Change " + esc(existing.name) : "Add a Player") + "</h2></div>" +
    '<div class="panel"><label class="eyebrow" for="pname">Name</label>' +
    '<input class="nameinput" id="pname" maxlength="16" autocomplete="off" value="' +
      (existing ? esc(existing.name) : "") + '" placeholder="Type a name">' +
    '<label class="eyebrow" style="margin-top:0.6rem">Pick a titan</label>' +
    '<div class="avatarpick" id="avpick">' + picks + "</div></div>" +
    '<div class="row"><button class="primary" id="savep">' + (existing ? "Save changes" : "Create player") + "</button>" +
    '<button class="ghost" id="cancelp">Cancel</button></div></div>');

  root.querySelectorAll("[data-av]").forEach(b => b.addEventListener("click", e => {
    e.stopPropagation();
    chosen = b.dataset.av;
    root.querySelectorAll("[data-av]").forEach(x => x.setAttribute("aria-pressed", x.dataset.av === chosen));
  }));
  const input = el("pname");
  setTimeout(() => { try { input.focus(); } catch(e) {} }, 60);
  input.addEventListener("click", e => e.stopPropagation());
  input.addEventListener("keydown", e => {
    e.stopPropagation();
    if (e.key === "Enter") el("savep").click();
  });
  on("cancelp", screenPlayers);
  on("savep", () => {
    const name = (input.value || "").trim();
    if (!name) { input.focus(); return; }
    if (existing) {
      existing.name = name; existing.avatar = chosen; savePlayers();
      if (existing.id === PLAYERS.activeId) paintPlayerButton();
    } else {
      const p = createPlayer(name, chosen);
      selectPlayer(p.id);
    }
    screenPlayers();
  });
}

/* =========================================================================
   TYPING ENGINE
   ========================================================================= */
let T = null;
function makeRun(prompts, opts){
  return Object.assign({ prompts: prompts, i: 0, c: 0, bad: false, hits: 0, misses: 0,
    started: null, hideText: false, onChar: null, onWord: null, onDone: null }, opts || {});
}
function currentPrompt(){ return T.prompts[T.i]; }
function targetChar(){ const p = currentPrompt(); return p ? p[T.c] : null; }

function renderPrompt(){
  const p = currentPrompt(); if (!p) return "";
  return p.split("").map((ch, i) => {
    const cls = "ch" + (i < T.c ? " done" : "") + (i === T.c ? " now" + (T.bad ? " bad" : "") : "");
    let shown = ch === " " ? "␣" : ch;
    if (T.hideText && i >= T.c) shown = ch === " " ? "␣" : "•";
    return '<span class="' + cls + '">' + esc(shown) + "</span>";
  }).join("");
}
function renderKeyboard(){
  if (!S.settings.keyboard) return "";
  const tgt = targetChar(), tk = baseKey(tgt), shift = tgt !== null && needsShift(tgt);
  const rows = KEYROWS.map(row => '<div class="krow">' + row.map(k =>
    '<div class="key' + (k === " " ? " space" : "") + (k === tk ? " target" + (T.bad ? " bad" : "") : "") +
    '" data-f="' + (FINGER[k] || "th") + '">' + esc(k === " " ? "space" : k.toUpperCase()) + "</div>").join("") + "</div>").join("");
  return '<div class="kbd">' + rows +
    '<div class="krow"><div class="key wide' + (shift ? " target" : "") + '" data-f="lp">shift</div>' +
    '<div class="key wide' + (shift ? " target" : "") + '" data-f="rp">shift</div></div></div>';
}
function fingerHint(){
  const tgt = targetChar(); if (tgt === null) return "";
  const f = FINGER[baseKey(tgt)];
  return (FINGER_NAME[f] || "thumb") + " → " + (tgt === " " ? "space bar" : '"' + tgt + '"') + (needsShift(tgt) ? " (hold Shift)" : "");
}
function paint(){
  if (!T) return;
  const p = el("promptLine"); if (p) p.innerHTML = renderPrompt();
  const k = el("kbdSlot"); if (k) k.innerHTML = renderKeyboard();
  const f = el("fingerHint"); if (f) f.textContent = fingerHint();
  const d = el("progdots");
  if (d) d.innerHTML = T.prompts.map((_, i) => '<i class="' + (i < T.i ? "on" : i === T.i ? "now" : "") + '"></i>').join("");
  const c = el("countReadout"); if (c) c.textContent = (Math.min(T.i + 1, T.prompts.length)) + " of " + T.prompts.length;
}
function accuracy(){ return T.hits + T.misses ? Math.round(T.hits / (T.hits + T.misses) * 100) : 100; }
function focusCapture(){ try { capture.focus({ preventScroll: true }); } catch(e) {} }

function handleChar(ch){
  const tgt = targetChar(); if (tgt === null) return;
  if (ch === tgt) {
    recordKey(ch, true); T.hits++; T.bad = false; T.c++;
    if (T.started === null) T.started = Date.now();
    SFX.ok();
    if (T.onChar) T.onChar(true);
    if (!T) return;
    if (T.c >= currentPrompt().length) {
      T.i++; T.c = 0;
      SFX.word();
      if (T.onWord) T.onWord();
      if (!T) return;
      if (T.i >= T.prompts.length) { if (T.onDone) T.onDone(); return; }
      if (T.hideText) setTimeout(() => { if (T) speak(currentPrompt()); }, 280);
    }
  } else {
    recordKey(tgt, false); T.misses++; T.bad = true;
    SFX.miss();
    if (T.onChar) T.onChar(false);
    if (!T) return;
  }
  paint();
}
document.addEventListener("keydown", e => {
  if (!T) return;
  if (e.key === "Backspace") { e.preventDefault(); return; }
  if (e.metaKey || e.ctrlKey || e.altKey || e.key.length !== 1) return;
  e.preventDefault();
  handleChar(e.key);
});
document.addEventListener("click", () => { if (T) focusCapture(); });

function startLevel(ci, si, li){
  const c = CONTENT[ci], st = c.stages[si], lv = st.levels[li];
  const words = adaptOrder(lv.words), isEcho = lv.type === "echo";
  const hero = TITANS[c.hero];
  MUSIC.play("explore");

  show('<div class="screen stagewrap">' +
    stageArt(st.scene, hero.rig, hero.color, "strip") +
    '<div><span class="eyebrow">' + esc(c.name) + ' · Stage ' + (si + 1) + '</span>' +
    '<h2 class="title">' + esc(st.name) + ' — ' + esc(lv.name) + '</h2></div>' +
    (li === 0 ? '<div class="callout atomic"><span class="speaker">Monarch Briefing</span>' + esc(st.brief) + "</div>" : "") +
    (isEcho ? '<div class="callout"><span class="speaker">Dictation</span>Listen, then type what you hear. The letters stay hidden until you get them right. Press the button to hear it again as many times as you want.</div>' : "") +
    '<div class="hud"><span class="readout" id="countReadout"></span><div class="progdots" id="progdots"></div>' +
    '<span class="spacer"></span>' + (isEcho ? '<button id="again">🔊 Hear it again</button>' : "") +
    '<button id="quit" class="ghost">Back to map</button></div>' +
    '<div class="typebox"><div class="prompt" id="promptLine"></div><div class="fingerhint" id="fingerHint"></div></div>' +
    '<div id="kbdSlot"></div>' +
    '<p class="hint">Backspace is switched off on purpose. If you press a wrong key nothing happens at all — just find the right one and carry on.</p></div>');

  T = makeRun(words, { hideText: isEcho, onDone: () => finishLevel(ci, si, li) });
  paint(); focusCapture();
  if (isEcho) {
    setTimeout(() => { if (T) speak(words[0]); }, 420);
    on("again", e => { e.stopPropagation(); speak(currentPrompt()); focusCapture(); });
  }
  on("quit", () => { T = null; screenCampaign(ci); });
}

function finishLevel(ci, si, li){
  const acc = accuracy();
  S.cleared[nodeId(ci, si, li)] = { acc: acc, chars: T.hits, ms: T.started ? Date.now() - T.started : 0 };
  save(); SFX.win();
  T = null;
  storyScreen(ci, si, li, acc);
}

/* =========================================================================
   SCREEN: STORY CHAPTER — the reward after every exercise
   ========================================================================= */
function storyScreen(ci, si, li, acc){
  const c = CONTENT[ci], st = c.stages[si];
  const boss = li === bossIndex(ci, si);
  const lv = boss ? null : st.levels[li];
  const paras = boss ? st.winStory : lv.story;
  const title = boss ? TITANS[st.boss].name + " — Down" : lv.title;
  const chap = chapterNumber(ci, si, li);
  const art = boss ? TITANS[st.boss] : TITANS[c.hero];
  S.read[nodeId(ci, si, li)] = true; save();
  MUSIC.play(boss ? "victory" : "story");

  const nextLi = li + 1;
  const isBossNext = nextLi === bossIndex(ci, si);
  const moreStages = si + 1 < c.stages.length;
  const sessionOver = (Date.now() - sessionStart) > SESSION_GOAL_MS && !sessionOffered;
  if (sessionOver) sessionOffered = true;

  show('<div class="screen storywrap">' +
    stageArt(st.scene, art.rig, art.color, "hero") +
    '<div class="chapline"><span class="chapno">Chapter ' + chap + '</span>' +
      '<span class="eyebrow">' + esc(c.name) + '</span></div>' +
    '<h2 class="title">' + esc(title) + '</h2>' +
    paras.map((p, i) => '<p class="storytext' + (i === 0 ? " dropcap" : "") + '">' + esc(p) + "</p>").join("") +
    (boss ? '<div class="callout atomic"><span class="speaker">Dossier recovered</span>' +
      esc(TITANS[st.boss].name) + " — " + esc(TITANS[st.boss].desig) + ". " + esc(TITANS[st.boss].note) + "</div>" : "") +
    (acc !== undefined ? '<div class="row" style="gap:2rem"><div class="bigstat"><b>' + acc + '%</b><span>Accuracy that round</span></div>' +
      '<div class="bigstat"><b>' + Object.keys(S.read).length + '</b><span>Chapters read</span></div></div>' : "") +
    (sessionOver ? '<div class="callout"><span class="speaker">Monarch</span>That is a full session — really good work. This is a great place to stop for today. If you want one more, go ahead.</div>' : "") +
    '<div class="row">' +
      '<button id="readaloud">🔊 Read it to me</button>' +
      (!boss ? '<button class="primary" id="next">' + (isBossNext ? "⚔ Face " + esc(TITANS[st.boss].name) : "Next exercise →") + "</button>"
             : (moreStages ? '<button class="primary" id="next">Next stage →</button>' : "")) +
      '<button id="story" class="ghost">Story so far</button>' +
      '<button id="map" class="ghost">Map</button>' +
    "</div></div>");

  on("readaloud", e => { e.stopPropagation(); speak(paras.join(" ")); });
  on("map", () => screenCampaign(ci));
  on("story", screenStory);
  on("next", () => {
    if (!boss) { if (isBossNext) startBoss(ci, si); else startLevel(ci, si, nextLi); }
    else startLevel(ci, si + 1, 0);
  });
}

/* =========================================================================
   SCREEN: BOSS BATTLE — animated, and still with no clock anywhere
   ========================================================================= */
const MISSES_PER_ATTACK = 5, SHIELDS = 3, CHARGE_MAX = 4, BOSS_HP = 14, FINISHER_DAMAGE = 4;

function battleWords(ci, si){
  const pool = [];
  CONTENT[ci].stages[si].levels.forEach(lv => pool.push.apply(pool, lv.words));
  const uniq = adaptOrder(Array.from(new Set(pool)));
  const out = [];
  while (out.length < 24) out.push(uniq[out.length % uniq.length]);
  return out;
}

function startBoss(ci, si){
  const c = CONTENT[ci], st = c.stages[si], t = TITANS[st.boss];
  // A stage can name its own fighters; otherwise the storyline's hero fights.
  const heroIds = st.heroes || [c.hero];
  const heroes = heroIds.map(id => TITANS[id]);
  const hero = heroes[0];
  const team = heroIds.length > 1;
  let turn = 0;   // in a team fight, the heroes take turns striking
  const words = battleWords(ci, si);
  const fin = team ? FINISHER.team : (FINISHER[heroIds[0]] || FINISHER.godzilla);
  const heroLayer = team
    ? heroIds.map((id, i) => '<g id="heroG' + i + '">' +
        titanSVG(TITANS[id].rig, TITANS[id].color, { scale: 0.56, dx: i === 0 ? 70 : 0, dy: 68 }) + "</g>")
        .reverse().join("")      // draw the second hero first, so the first stands in front
    : '<g id="heroG0">' + titanSVG(hero.rig, hero.color, { scale: 0.66, dx: 8, dy: 56 }) + "</g>";
  let hp = BOSS_HP, shields = SHIELDS, missBuf = 0, charge = 0, wordMisses = 0, over = false;
  const gid = "b" + (++artSeq);
  MUSIC.play("battle");

  const arena = S.settings.art
    ? '<div class="arena-art" id="arena">' +
      '<svg viewBox="0 0 480 180" preserveAspectRatio="xMidYMid meet">' +
        sceneSVG(st.scene, gid, 2) +
        heroLayer +
        '<g id="foeG">' + titanSVG(t.rig, t.color, { flip: true, flipW: 480, scale: 0.66, dx: 8, dy: 56 }) + "</g>" +
        '<rect class="beam" id="beam" x="166" y="96" width="150" height="5" rx="2.5" fill="' + hero.color + '"/>' +
        '<rect class="bigbeam" id="bigbeam" x="162" y="88" width="162" height="14" rx="7" fill="#ffffff" opacity="0"/>' +
        '<circle class="impact" id="impact" cx="322" cy="98" r="4" fill="none" stroke="' + t.color + '" stroke-width="2"/>' +
      "</svg>" +
      '<div class="movebanner"><b id="moveName"></b></div>' +
      "<div class='flashlayer' id='flash'></div></div>"
    : '<div class="movebanner" style="position:static;margin:0.2rem 0"><b id="moveName"></b></div>';

  show('<div class="screen stagewrap">' +
    '<div><span class="eyebrow">' + esc(c.name) + " · Stage " + (si + 1) + ' · Boss</span>' +
    '<h2 class="title">' + esc(t.name) + "</h2></div>" +
    '<div class="callout ember"><span class="speaker">Incoming</span>' + esc(st.bossLine) + "</div>" +
    arena +
    '<div class="combat">' +
      '<div class="gauge"><div class="gname">' + esc(heroes.map(h => h.name).join(" & ")) + "</div>" +
      '<div class="gsub">' + esc(heroes.map(h => h.desig).join(" · ")) + "</div>" +
      '<div class="shields" id="shields"></div>' +
      '<div class="chargebar" id="chargebar"><i id="chargeFill"></i></div>' +
      '<div class="gsub" id="chargeLabel">Shields · ' + esc(fin.name) + " charge</div></div>" +
      '<div class="gauge"><div class="gname">' + esc(t.name) + "</div>" +
      '<div class="gsub">' + esc(t.desig) + " · " + esc(t.role) + "</div>" +
      '<div class="hpbar"><i id="hp"></i></div><div class="charge"><i id="charge"></i></div>' +
      '<div class="gsub">Health · its next attack</div></div>' +
    "</div>" +
    '<div class="hud"><span class="readout" id="countReadout"></span><div class="progdots" id="progdots"></div>' +
    '<span class="spacer"></span><button id="quit" class="ghost">Retreat to map</button></div>' +
    '<div class="typebox"><div class="prompt" id="promptLine"></div><div class="fingerhint" id="fingerHint"></div></div>' +
    '<div id="kbdSlot"></div>' +
    '<p class="hint">Every word you finish is a strike. Finish ' + CHARGE_MAX +
    " in a row without a single mistake and the next one becomes " + esc(fin.name) +
    ". There is no clock — take as long as you like, because " + esc(t.name) +
    " only gets a turn when you miss five keys.</p></div>");

  function ready(){ return charge >= CHARGE_MAX; }
  function gauges(){
    el("hp").style.width = Math.max(0, hp / BOSS_HP * 100) + "%";
    el("charge").style.width = (missBuf / MISSES_PER_ATTACK * 100) + "%";
    let sh = "";
    for (let i = 0; i < SHIELDS; i++) sh += '<i class="' + (i < shields ? "" : "gone") + '"></i>';
    el("shields").innerHTML = sh;
    const bar = el("chargebar");
    el("chargeFill").style.width = Math.min(100, charge / CHARGE_MAX * 100) + "%";
    bar.classList.toggle("full", ready());
    el("chargeLabel").innerHTML = ready()
      ? '<span class="readybadge">' + esc(fin.name) + " READY — type the next word</span>"
      : "Shields · " + esc(fin.name) + " charge " + charge + "/" + CHARGE_MAX;
  }
  function fx(id, cls, ms){
    if (!S.settings.motion) return;
    const e = el(id); if (!e) return;
    e.classList.remove(cls); void e.getBoundingClientRect();
    e.classList.add(cls);
    setTimeout(() => { if (e) e.classList.remove(cls); }, ms);
  }
  function banner(text, isFin){
    const b = el("moveName"); if (!b) return;
    b.textContent = text;
    b.className = "";
    void b.getBoundingClientRect();
    b.className = "go" + (isFin ? " fin" : "");
  }
  function heroAttacks(){
    const who = team ? turn++ % heroIds.length : 0;
    const moves = MOVES[heroIds[who]] || MOVES.godzilla;
    const move = moves[Math.floor(Math.random() * moves.length)];
    banner(team ? heroes[who].name + ": " + move : move, false);
    fx("heroG" + who, "fx-lunge-r", 420);
    fx("beam", "fire", 520);
    setTimeout(() => { fx("foeG", "fx-recoil-r", 380); fx("impact", "go", 520); }, 180);
  }
  function finisherAttacks(){
    banner(fin.name, true);
    heroIds.forEach((_, i) => fx("heroG" + i, "fx-lunge-r", 420));
    fx("bigbeam", "fire", 1150);
    tone(60, 900, 0.09, "sawtooth");
    setTimeout(() => tone(180, 700, 0.06, "square"), 120);
    setTimeout(() => {
      fx("foeG", "fx-recoil-r", 380);
      fx("arena", "shaking", 420);
      fx("flash", "go", 380);
      fx("impact", "go", 520);
    }, 380);
  }
  function foeAttacks(){
    fx("foeG", "fx-lunge-l", 420);
    setTimeout(() => {
      heroIds.forEach((_, i) => fx("heroG" + i, "fx-recoil-l", 380));
      fx("arena", "shaking", 420); fx("flash", "go", 380);
    }, 150);
  }
  function finish(){
    if (over) return;
    over = true; T = null;
    setTimeout(() => bossVictory(ci, si), 700);
  }

  T = makeRun(words, {
    onWord: () => {
      const clean = wordMisses === 0;
      if (ready()) {
        hp -= FINISHER_DAMAGE; charge = 0;
        SFX.hit(); finisherAttacks();
      } else {
        hp -= 1;
        if (clean) charge++;
        SFX.hit(); heroAttacks();
      }
      wordMisses = 0;
      gauges();
      if (hp <= 0) finish();
    },
    onChar: ok => {
      if (ok) return;
      wordMisses++; missBuf++;
      if (missBuf >= MISSES_PER_ATTACK) {
        missBuf = 0; shields--; charge = 0;
        SFX.hurt(); foeAttacks();
        if (shields <= 0) { over = true; T = null; setTimeout(() => regroup(ci, si), 700); return; }
      }
      gauges();
    },
    onDone: finish
  });
  paint(); gauges(); focusCapture();
  on("quit", () => { T = null; MUSIC.play("explore"); screenCampaign(ci); });
}

function regroup(ci, si){
  const st = CONTENT[ci].stages[si], t = TITANS[st.boss];
  MUSIC.play("story");
  show('<div class="screen">' +
    stageArt(st.scene, t.rig, t.color, "strip") +
    '<div><span class="eyebrow">Regroup</span><h2 class="title">Pull back and go again</h2></div>' +
    '<div class="callout"><span class="speaker">Monarch</span>Shields are down, so we are pulling you out. Nothing is lost — ' + esc(t.name) +
    " is exactly where you left it, and so is every chapter and every level you have already cleared. Most of Monarch needed three tries at this one.</div>" +
    '<div class="row"><button class="primary" id="retry">⚔ Try ' + esc(t.name) + " again</button>" +
    '<button id="practice">Practise the words first</button>' +
    '<button id="map" class="ghost">Back to map</button></div></div>');
  on("retry", () => startBoss(ci, si));
  on("practice", () => startLevel(ci, si, bossIndex(ci, si) - 1));
  on("map", () => screenCampaign(ci));
}

function bossVictory(ci, si){
  const st = CONTENT[ci].stages[si];
  S.cleared[nodeId(ci, si, bossIndex(ci, si))] = { acc: 100, chars: 0, ms: 0 };
  S.cards[st.boss] = true;
  save(); SFX.win();
  storyScreen(ci, si, bossIndex(ci, si), undefined);
}

/* =========================================================================
   SCREEN: STORY SO FAR
   ========================================================================= */
function screenStory(){
  T = null;
  let out = "", n = 0, any = false;
  CONTENT.forEach((c, ci) => {
    let block = "";
    c.stages.forEach((st, si) => {
      st.levels.forEach((lv, li) => {
        n++;
        if (!S.read[nodeId(ci, si, li)]) return;
        any = true;
        block += '<div class="panel"><span class="chapno">Chapter ' + n + "</span>" +
          '<h3 class="sub">' + esc(lv.title) + "</h3>" +
          lv.story.map(p => '<p class="storytext" style="font-size:1rem">' + esc(p) + "</p>").join("") + "</div>";
      });
      const bi = bossIndex(ci, si); n++;
      if (S.read[nodeId(ci, si, bi)]) {
        any = true;
        block += '<div class="panel" style="border-left:3px solid var(--ember)"><span class="chapno">Chapter ' + n + "</span>" +
          '<h3 class="sub">' + esc(TITANS[st.boss].name) + " — Down</h3>" +
          st.winStory.map(p => '<p class="storytext" style="font-size:1rem">' + esc(p) + "</p>").join("") + "</div>";
      }
    });
    if (block) out += '<div><span class="eyebrow">' + esc(c.name) + "</span></div>" + block;
  });
  show('<div class="screen">' +
    '<div><span class="eyebrow">Everything you have unlocked</span><h2 class="title">The Story So Far</h2></div>' +
    (any ? '<p class="lede">' + Object.keys(S.read).length + " chapters of " + n + ". Finish an exercise to unlock the next one.</p>" + out
         : '<p class="lede">No chapters yet. Finish your first exercise and the story starts.</p>') +
    "</div>");
}

/* =========================================================================
   SCREEN: DOSSIERS
   ========================================================================= */
function screenCards(){
  T = null;
  const starters = ["godzilla", "kong", "mothra"];
  const ids = Object.keys(TITANS);
  const cards = ids.map(id => {
    const t = TITANS[id], got = !!S.cards[id] || starters.indexOf(id) >= 0;
    return '<div class="dossier' + (got ? "" : " sealed") + '">' +
      (S.settings.art ? '<div class="stage-art card" style="border:0;border-bottom:1px solid var(--edge);border-radius:0">' +
        '<svg viewBox="0 0 240 180" preserveAspectRatio="xMidYMid meet">' + sceneSVG(t.scene, "d" + id) +
        titanSVG(t.rig, got ? t.color : "#3a4652", { scale: 0.8, dx: 24, dy: 26 }) + "</svg></div>" : "") +
      '<div class="dbody"><div class="dname">' + (got ? esc(t.name) : "Classified") + "</div>" +
      '<div class="drow">' + (got ? esc(t.desig) + " · " + esc(t.role) : "Dossier sealed") + "</div>" +
      '<div class="dnote">' + (got ? esc(t.note) : "Beat this titan to unlock its Monarch file.") + "</div></div></div>";
  }).join("");
  const found = ids.filter(id => S.cards[id] || starters.indexOf(id) >= 0).length;
  show('<div class="screen">' +
    '<div><span class="eyebrow">Monarch archive</span><h2 class="title">Titan Dossiers</h2></div>' +
    '<p class="lede">One file for every titan you have met. ' + found + " of " + ids.length + " recovered.</p>" +
    '<div class="cards">' + cards + "</div></div>");
}

/* =========================================================================
   SCREEN: SETTINGS
   ========================================================================= */
function screenSettings(){
  T = null;
  const s = S.settings;
  const tog = (id, label, onv) => '<div class="setrow"><label>' + label + "</label>" +
    '<button class="toggle" id="' + id + '" aria-pressed="' + (onv ? "true" : "false") + '">' + (onv ? "On" : "Off") + "</button></div>";
  show('<div class="screen">' +
    '<div><span class="eyebrow">Comfort</span><h2 class="title">Settings</h2></div>' +
    '<p class="lede">Change these any time — none of it affects progress. If the screen is too busy today, turn the pictures or the animation off and everything still works.</p>' +
    '<div class="panel"><div class="setgrid"><div>' +
      tog("tArt", "Pictures and scenery", s.art) +
      tog("tMotion", "Animation", s.motion) +
      tog("tSound", "Sound effects", s.sound) +
      tog("tMusic", "Music", s.music) +
      '<div class="setrow"><label>Music volume</label><span class="row">' +
      '<button id="volDown">−</button><span class="mono" style="min-width:2.6rem;text-align:center">' +
      Math.round(s.musicVol * 100) + "%</span><button id='volUp'>+</button></span></div>" +
    "</div><div>" +
      tog("tSpeech", "Read words out loud", s.speech) +
      tog("tKeyboard", "Show the keyboard guide", s.keyboard) +
      tog("tContrast", "High contrast", s.contrast === "high") +
      '<div class="setrow"><label>Text size</label><span class="row">' +
      '<button id="sizeDown">−</button><span class="mono" id="sizeVal" style="min-width:2.6rem;text-align:center">' +
      s.typeSize.toFixed(1) + "</span><button id='sizeUp'>+</button></span></div>" +
    "</div></div>" +
    '<p class="lede" style="font-size:0.85rem">Now playing: <span class="mono">' + esc(MUSIC.source()) + "</span>. " +
    'The game looks for <span class="mono">music/explore.mp3</span>, <span class="mono">battle.mp3</span>, <span class="mono">story.mp3</span> and <span class="mono">victory.mp3</span> beside this file and uses them if they are there. ' +
    "Otherwise it generates its own score. MP3s only play when the game is opened from your own computer — the web version always uses the generated score.</p>" +
    '<p class="lede" style="font-size:0.85rem">Music: <strong>Descent</strong>, <strong>Song of the Forge</strong>, <strong>Dragon\'s Lullaby</strong> and <strong>Simulacra</strong> by Scott Buckley (scottbuckley.com.au), used under CC BY 4.0.</p></div>' +
    '<div class="panel"><span class="eyebrow">For grown-ups</span>' +
    '<h3 class="sub">Progress report — ' + esc(activePlayer() ? activePlayer().name : "no player") + "</h3>" +
    growUpBlock() +
    '<p class="lede" style="font-size:0.85rem">These settings and this progress belong to this player only. Everyone else keeps their own.</p>' +
    '<div class="row"><button id="players">Switch player</button>' +
    '<button id="reset" class="ghost">Erase this player\'s progress</button></div></div></div>');

  const flip = (id, get, set) => on(id, () => { set(!get()); save(); applySettings(); screenSettings(); });
  flip("tArt", () => s.art, v => s.art = v);
  flip("tMotion", () => s.motion, v => s.motion = v);
  flip("tSound", () => s.sound, v => s.sound = v);
  flip("tSpeech", () => s.speech, v => s.speech = v);
  flip("tKeyboard", () => s.keyboard, v => s.keyboard = v);
  on("tMusic", () => {
    s.music = !s.music; save();
    if (s.music) MUSIC.play("explore"); else MUSIC.stop();
    screenSettings();
  });
  on("volUp", () => { s.musicVol = Math.min(1, +(s.musicVol + 0.1).toFixed(2)); MUSIC.vol(s.musicVol); save(); screenSettings(); });
  on("volDown", () => { s.musicVol = Math.max(0, +(s.musicVol - 0.1).toFixed(2)); MUSIC.vol(s.musicVol); save(); screenSettings(); });
  on("tContrast", () => { s.contrast = s.contrast === "high" ? "normal" : "high"; save(); applySettings(); screenSettings(); });
  on("sizeUp", () => { s.typeSize = Math.min(3.4, s.typeSize + 0.2); save(); applySettings(); screenSettings(); });
  on("sizeDown", () => { s.typeSize = Math.max(1.1, s.typeSize - 0.2); save(); applySettings(); screenSettings(); });
  on("players", screenPlayers);
  on("reset", () => {
    const p = activePlayer();
    if (confirm("Erase " + (p ? p.name + "'s" : "all") + " progress, chapters, dossiers and stats?\n\n" +
                "Other players are not affected. This cannot be undone.")) {
      S = seedDefaults(); save(); applySettings(); screenMap();
    }
  });
}

function growUpBlock(){
  const rows = Object.keys(S.keyStats).map(k => {
    const st = S.keyStats[k], total = st[0] + st[1];
    return { k: k, total: total, acc: total ? st[0] / total : 1 };
  }).filter(r => r.total >= 5).sort((a, b) => a.acc - b.acc).slice(0, 8);
  const cleared = Object.keys(S.cleared).map(k => S.cleared[k]);
  const chars = cleared.reduce((n, r) => n + (r.chars || 0), 0);
  const ms = cleared.reduce((n, r) => n + (r.ms || 0), 0);
  const wpm = ms > 0 ? Math.round((chars / 5) / (ms / 60000)) : 0;
  const table = rows.length
    ? '<div class="scroller"><table class="stats"><thead><tr><th>Key</th><th>Attempts</th><th>Accuracy</th></tr></thead><tbody>' +
      rows.map(r => "<tr><td>" + (r.k === " " ? "space" : r.k.toUpperCase()) + "</td><td>" + r.total + "</td><td>" +
        Math.round(r.acc * 100) + "%</td></tr>").join("") + "</tbody></table></div>"
    : '<p class="lede">Not enough practice yet to show per-key accuracy.</p>';
  return '<div class="row" style="gap:2rem;margin-bottom:0.4rem">' +
    '<div class="bigstat"><b>' + overallAccuracy() + '%</b><span>Overall accuracy</span></div>' +
    '<div class="bigstat"><b>' + wpm + '</b><span>Words per minute</span></div>' +
    '<div class="bigstat"><b>' + Object.keys(S.read).length + '</b><span>Chapters read</span></div></div>' +
    '<p class="lede" style="font-size:0.88rem">Speed is deliberately never shown to him — the game scores accuracy only. The weakest keys below are quietly moved to the front of the next word lists he plays, and he is never told which they are.</p>' + table;
}

/* =========================================================================
   TUTORIAL — a spotlight walkthrough of every button and every screen
   ========================================================================= */
const TUTORIAL = (function(){
  let i = 0, veil = null, hole = null, box = null, active = false;

  const STEPS = [
    { title: "Welcome to Titan Protocol",
      text: "This is a typing game, and it is also a story about giant monsters. Every exercise you finish unlocks the next chapter. Let's walk through the whole thing — it takes about a minute.",
      setup: () => screenMap() },
    { sel: "#btnPlayer", title: "Who's playing",
      text: "Your name lives up here. More than one person can play on this computer, and everybody gets their own story, their own dossiers and their own settings — press this to switch." },
    { sel: "#btnMap", title: "The Map button",
      text: "This always brings you back to the front page, no matter where you are or what you are in the middle of. Nothing is ever lost by pressing it." },
    { sel: "#btnStory", title: "Story so far",
      text: "Every chapter you have unlocked is saved here so you can read the whole story again from the beginning, any time." },
    { sel: "#btnCards", title: "Dossiers",
      text: "A file card for every titan. They start out Classified, and each one unlocks when you beat that titan in a boss fight." },
    { sel: "#btnSettings", title: "Settings",
      text: "Sound, music, pictures, animation, text size and high contrast — all switchable. If the screen feels like too much on a given day, turn things off here and everything still works." },
    { sel: ".campaigns .camp", title: "Pick a storyline",
      text: "There are four separate stories. You can play them in any order. Each one teaches different keys and ends with a different titan.",
      setup: () => screenMap() },
    { sel: ".stages .stage", title: "Stages and exercises",
      text: "Each storyline is made of stages, and each stage teaches you two new keys. The small buttons are the exercises. Do them left to right.",
      setup: () => screenCampaign(0) },
    { sel: ".stages .stage .node.boss", title: "The boss fight",
      text: "The red one at the end of every stage is a titan. It unlocks once you have finished the three exercises in front of it.",
      setup: () => screenCampaign(0) },
    { sel: "#promptLine", title: "The word you are typing",
      text: "Type it one letter at a time. Letters you have already got right turn green, and the letter you are on has a yellow line under it.",
      setup: () => { startLevel(0, 0, 0); T = null; } },
    { sel: "#kbdSlot", title: "The keyboard guide",
      text: "The key you need next lights up yellow, and the coloured strip under each key tells you which finger it belongs to. Try not to look down at the real keyboard — look here instead." },
    { sel: "#fingerHint", title: "Which finger",
      text: "And if you are still not sure, this line spells it out in words." },
    { sel: "#progdots", title: "How far through you are",
      text: "This is the only progress bar in the game, and it counts words, not seconds. There is no clock anywhere. Take as long as you want on every single word." },
    { sel: ".typebox", title: "Wrong keys do nothing",
      text: "Backspace is switched off on purpose, and if you press a wrong key, absolutely nothing happens — no buzzer, no lost life, no going back. Just find the right key and carry on." },
    { sel: "#arena", title: "Boss fights",
      text: "In a boss fight, every word you finish is a strike — a punch, a tail sweep, an axe swing. Watch the top of the picture for the name of the move you just landed.",
      setup: () => { startBoss(0, 0); T = null; } },
    { sel: "#chargebar", title: "Charging the finisher",
      text: "Finish four words in a row with no mistakes at all and this bar fills up. When it does, the very next word becomes ATOMIC BREATH — one enormous hit that takes off a quarter of the titan's health." },
    { sel: "#shields", title: "Your shields",
      text: "You have three. The titan only gets a turn when you miss five keys, and it takes one shield when it does. Run out and you simply try again with everything you have already done still saved." },
    { title: "And then you read",
      text: "Every time you finish an exercise or beat a titan, you get the next chapter of the story to read, with a button that reads it out loud to you. That is the whole game. Go and wake something up.",
      setup: () => screenMap() }
  ];

  function build(){
    veil = document.createElement("div"); veil.className = "tut-veil";
    hole = document.createElement("div"); hole.className = "tut-hole";
    box  = document.createElement("div"); box.className = "tut-box";
    document.body.appendChild(veil);
    document.body.appendChild(hole);
    document.body.appendChild(box);
    box.addEventListener("click", e => {
      const a = e.target.getAttribute && e.target.getAttribute("data-tut");
      if (!a) return;
      e.stopPropagation();
      if (a === "next") go(i + 1);
      else if (a === "back") go(i - 1);
      else stop();
    });
  }

  function position(){
    const s = STEPS[i];
    const t = s.sel ? document.querySelector(s.sel) : null;
    box.innerHTML =
      '<span class="tut-step">Step ' + (i + 1) + " of " + STEPS.length + "</span>" +
      "<h4>" + esc(s.title) + "</h4><p>" + esc(s.text) + "</p>" +
      '<div class="tut-nav">' +
        (i > 0 ? '<button data-tut="back" class="ghost">← Back</button>' : "") +
        '<button data-tut="stop" class="ghost">Skip</button>' +
        '<button data-tut="next" class="primary">' + (i === STEPS.length - 1 ? "Let's go" : "Next →") + "</button>" +
      "</div>";
    const bw = Math.min(340, window.innerWidth - 24);
    box.style.width = bw + "px";
    if (t) {
      veil.style.display = "none";
      hole.style.display = "block";
      const r = t.getBoundingClientRect();
      hole.style.left = (r.left - 6) + "px";
      hole.style.top = (r.top - 6) + "px";
      hole.style.width = (r.width + 12) + "px";
      hole.style.height = (r.height + 12) + "px";
      const bh = box.offsetHeight || 190;
      let top = r.bottom + 14;
      if (top + bh > window.innerHeight - 10) top = Math.max(10, r.top - bh - 14);
      let left = r.left + r.width / 2 - bw / 2;
      left = Math.max(10, Math.min(left, window.innerWidth - bw - 10));
      box.style.top = top + "px";
      box.style.left = left + "px";
    } else {
      hole.style.display = "none";
      veil.style.display = "block";
      const bh = box.offsetHeight || 190;
      box.style.top = Math.max(12, window.innerHeight / 2 - bh / 2) + "px";
      box.style.left = Math.max(10, window.innerWidth / 2 - bw / 2) + "px";
    }
  }

  function go(n){
    if (n < 0) return;
    if (n >= STEPS.length) return stop();
    i = n;
    const s = STEPS[i];
    if (s.setup) s.setup();
    T = null;
    const t = s.sel ? document.querySelector(s.sel) : null;
    if (t) { try { t.scrollIntoView({ block: "center" }); } catch(e) { t.scrollIntoView(); } }
    setTimeout(position, 80);
  }

  function stop(){
    active = false;
    [veil, hole, box].forEach(e => { if (e && e.parentNode) e.parentNode.removeChild(e); });
    veil = hole = box = null;
    S.tutorialDone = true; save();
    T = null;
    MUSIC.play("explore");
    screenMap();
  }

  return {
    start: function(){
      if (active) return;
      active = true; i = 0;
      build();
      go(0);
    },
    running: function(){ return active; }
  };
})();
/* ---------------- boot ---------------- */
on("btnMap", screenMap);
on("btnCards", screenCards);
on("btnStory", screenStory);
on("btnSettings", screenSettings);
on("btnPlayer", screenPlayers);

function boot(){
  try {
    const raw = localStorage.getItem(PROFILE_KEY);
    const p = raw ? JSON.parse(raw) : null;
    if (p && p.list && p.list.length) PLAYERS = p;
  } catch(e) {}

  if (!PLAYERS.list.length) {
    // First run. Carry over any progress from before profiles existed.
    let legacy = null;
    try { legacy = JSON.parse(localStorage.getItem(LEGACY_KEY)); } catch(e) {}
    const first = createPlayer("Nolan", "godzilla", legacy ? normalise(legacy) : null);
    PLAYERS.activeId = first.id;
    savePlayers();
    selectPlayer(first.id);
    screenMap();
    return;
  }

  const known = PLAYERS.list.some(p => p.id === PLAYERS.activeId);
  if (PLAYERS.list.length === 1 && known) {
    selectPlayer(PLAYERS.activeId);
    screenMap();
    return;
  }
  // More than one player: always ask who is playing.
  S = seedDefaults();
  applySettings();
  paintPlayerButton();
  screenPlayers();
}
boot();

/* Browsers will not start audio until the page has been touched once. */
function unlockAudio(){
  document.removeEventListener("pointerdown", unlockAudio);
  document.removeEventListener("keydown", unlockAudio);
  MUSIC.play("explore");
}
document.addEventListener("pointerdown", unlockAudio);
document.addEventListener("keydown", unlockAudio);
</script>
